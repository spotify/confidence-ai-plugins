name: happy-path-full-migration
description: >
  Full migration flow: user provides one simple flag (100% rollout
  to everyone), model scans, produces plan, user confirms, model
  creates flag via MCP tools.
skill: migrate-optimizely
tags: [multi-turn, happy-path, e2e]

source_flags:
  - key: new-homepage
    name: New homepage
    description: 100% rollout to everyone.
    archived: false
    variable_definitions: {}
    variations:
      - { key: on, name: On }
      - { key: off, name: Off }
    ruleset:
      enabled: true
      default_variation_key: off
      rule_priorities: [everyone]
      rules:
        everyone:
          type: targeted_delivery
          percentage_included: 10000
          audience_conditions: []
          audience_ids: []
          variations:
            on: { percentage_included: 10000 }
    referenced_audiences: {}

conversation:
  - |
    /migrate-optimizely plan flags

    Here are the flags from my Optimizely project:

    ```json
    [{"key":"new-homepage","name":"New homepage","description":"100% rollout to everyone.","archived":false,"variable_definitions":{},"variations":[{"key":"on","name":"On"},{"key":"off","name":"Off"}],"ruleset":{"enabled":true,"default_variation_key":"off","rule_priorities":["everyone"],"rules":{"everyone":{"type":"targeted_delivery","percentage_included":10000,"audience_conditions":[],"audience_ids":[],"variations":{"on":{"percentage_included":10000}}}}},"referenced_audiences":{}}]
    ```
  - "test-app"
  - "1"
  - "user_id"
  - "1"
  - |
    I've reviewed the plan. All flags marked [x] Migrate look correct. Execute.
  - "Yes"

assertions:
  - type: tool_called
    tool_name: mcp__confidence_flags__listClients
  - type: tool_called
    tool_name: mcp__confidence_flags__createFlag
  - type: tool_called
    tool_name: mcp__confidence_flags__addTargetingRule
  - type: tool_called_before
    first: mcp__confidence_flags__createFlag
    second: mcp__confidence_flags__addTargetingRule
