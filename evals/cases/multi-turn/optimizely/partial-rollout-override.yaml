name: partial-rollout-override-flow
description: >
  A 25% partial rollout (excluded by default) is overridden by
  the user ticking [x] Migrate. The model must warn about
  re-bucketing risk, ask for confirmation, ask for rollout
  percentage, then create the flag.
skill: migrate-optimizely
tags: [multi-turn, partial-rollout, override]

source_flags:
  - key: beta-feature
    name: Beta feature
    description: 25% rollout to beta users.
    archived: false
    variable_definitions: {}
    variations:
      - { key: on, name: On }
      - { key: off, name: Off }
    ruleset:
      enabled: true
      default_variation_key: off
      rule_priorities: [beta_rollout]
      rules:
        beta_rollout:
          type: targeted_delivery
          percentage_included: 2500
          audience_conditions: ["or", { audience_id: 1 }]
          audience_ids: [1]
          variations:
            on: { percentage_included: 10000 }
    referenced_audiences:
      "1":
        name: Beta users
        conditions: >
          ["and", {"type": "custom_attribute",
          "name": "is_beta", "match_type": "exact",
          "value": true}]

conversation:
  - |
    /migrate-optimizely plan flags

    Here are the flags from my Optimizely project:

    ```json
    [{"key":"beta-feature","name":"Beta feature","description":"25% rollout to beta users.","archived":false,"variable_definitions":{},"variations":[{"key":"on","name":"On"},{"key":"off","name":"Off"}],"ruleset":{"enabled":true,"default_variation_key":"off","rule_priorities":["beta_rollout"],"rules":{"beta_rollout":{"type":"targeted_delivery","percentage_included":2500,"audience_conditions":["or",{"audience_id":1}],"audience_ids":[1],"variations":{"on":{"percentage_included":10000}}}}},"referenced_audiences":{"1":{"name":"Beta users","conditions":"[\"and\",{\"type\":\"custom_attribute\",\"name\":\"is_beta\",\"match_type\":\"exact\",\"value\":true}]"}}}]
    ```
  - "test-app"
  - "1"
  - "1"
  - "1"
  - "Yes, execute"
  - |
    I've marked [x] Migrate on beta-feature. Execute the plan.
  - "Yes, I understand the bucketing risk. Proceed."
  - "25"
  - "Yes"
  - "Yes"

assertions:
  - type: text_contains_question
    pattern: "bucket"
  - type: text_contains
    pattern: "25%"
  - type: text_before_tool
    pattern: "bucket"
    tool_name: mcp__confidence_flags__createFlag
  - type: tool_called
    tool_name: mcp__confidence_flags__createFlag
  - type: tool_called
    tool_name: mcp__confidence_flags__addTargetingRule
  - type: tool_called_before
    first: mcp__confidence_flags__createFlag
    second: mcp__confidence_flags__addTargetingRule
