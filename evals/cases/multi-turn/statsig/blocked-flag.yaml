name: blocked-flag-not-created
description: >
  A gate using the str_contains_any operator must be classified
  as BLOCKED and never created in Confidence, even when the user
  tries to execute.
skill: migrate-statsig
tags: [multi-turn, blocked, safety]

source_flags:
  - id: gate_blocked
    name: Role Gate
    description: Gate using str_contains_any on role field.
    idType: userID
    isEnabled: true
    status: Active
    type: PERMANENT
    rules:
      - name: Admin roles
        id: rule_blocked
        passPercentage: 100
        conditions:
          - type: custom_field
            field: role
            operator: str_contains_any
            targetValue: ["admin", "superuser"]

conversation:
  - |
    /migrate-statsig plan flags

    Here are the flags from my project:

    ```json
    [{"id":"gate_blocked","name":"Role Gate","description":"Gate using str_contains_any on role field.","idType":"userID","isEnabled":true,"status":"Active","type":"PERMANENT","rules":[{"name":"Admin roles","id":"rule_blocked","passPercentage":100,"conditions":[{"type":"custom_field","field":"role","operator":"str_contains_any","targetValue":["admin","superuser"]}]}]}]
    ```
  - "test-app"
  - "1"
  - "user_id"
  - "1"
  - "No, skip it. Don't migrate this flag."

assertions:
  - type: tool_not_called
    tool_name: mcp__confidence_flags__createFlag
  - type: text_contains
    pattern: "blocked"
    case_sensitive: false
  - type: text_contains
    pattern: "str_contains"
    case_sensitive: false
