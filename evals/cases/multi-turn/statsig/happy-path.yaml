name: happy-path-full-migration
description: >
  Full migration flow: user provides one simple gate (100% rollout
  to everyone), model scans, produces plan, user confirms, model
  creates flag via MCP tools.
skill: migrate-statsig
tags: [multi-turn, happy-path, e2e]

source_flags:
  - id: gate_001
    name: Simple Gate
    description: Gate rolled out to everyone.
    idType: userID
    isEnabled: true
    status: Active
    type: PERMANENT
    rules:
      - name: Everyone
        id: rule_001
        passPercentage: 100
        conditions:
          - type: public

conversation:
  - |
    /migrate-statsig plan flags

    Here are the flags from my project:

    ```json
    [{"id":"gate_001","name":"Simple Gate","description":"Gate rolled out to everyone.","idType":"userID","isEnabled":true,"status":"Active","type":"PERMANENT","rules":[{"name":"Everyone","id":"rule_001","passPercentage":100,"conditions":[{"type":"public"}]}]}]
    ```
  - "test-app"
  - "1"
  - "user_id"
  - "1"
  - "Yes, execute"
  - "Yes"

assertions:
  - type: tool_called
    tool_name: mcp__confidence_flags__listClients
  - type: tool_called
    tool_name: mcp__confidence_flags__createFlag
  - type: tool_called
    tool_name: mcp__confidence_flags__addTargetingRule
  - type: tool_called_before
    first: mcp__confidence_flags__createFlag
    second: mcp__confidence_flags__addTargetingRule
