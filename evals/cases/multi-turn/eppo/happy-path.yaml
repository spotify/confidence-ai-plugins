name: happy-path-full-migration
description: >
  Full migration flow: user provides one simple gate (100% rollout
  to everyone), model scans, produces plan, user confirms, model
  creates flag via MCP tools.
skill: migrate-eppo
tags: [multi-turn, happy-path, e2e]

source_flags:
  - id: flag-001
    key: simple-gate
    name: Simple gate
    description: 100% rollout to everyone, no targeting.
    is_archived: false
    variation_type: BOOLEAN
    variations:
      - { id: var-on, name: On, variant_key: on }
      - { id: var-off, name: Off, variant_key: off }
    allocations:
      - id: alloc-default
        key: default
        name: Default allocation
        type: FEATURE_GATE
        percent_exposure: 100
        is_default: true
        targeting_rules: []
        variation_weight:
          - { variation_key: on, weight: 100 }

conversation:
  - |
    /migrate-eppo plan flags

    Here are the flags from my project:

    ```json
    [{"id":"flag-001","key":"simple-gate","name":"Simple gate","description":"100% rollout to everyone, no targeting.","is_archived":false,"variation_type":"BOOLEAN","variations":[{"id":"var-on","name":"On","variant_key":"on"},{"id":"var-off","name":"Off","variant_key":"off"}],"allocations":[{"id":"alloc-default","key":"default","name":"Default allocation","type":"FEATURE_GATE","percent_exposure":100,"is_default":true,"targeting_rules":[],"variation_weight":[{"variation_key":"on","weight":100}]}]}]
    ```
  - "test-app"
  - "production"
  - "1"
  - "user_id"
  - "1"
  - "Yes, execute"
  - "Yes"
  - "Yes"
  - "Yes"

assertions:
  - type: tool_called
    tool_name: mcp__confidence_flags__listClients
  - type: tool_called
    tool_name: mcp__confidence_flags__createFlag
  - type: tool_called
    tool_name: mcp__confidence_flags__addTargetingRule
  - type: tool_called_before
    first: mcp__confidence_flags__createFlag
    second: mcp__confidence_flags__addTargetingRule
