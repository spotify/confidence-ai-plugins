name: partial-rollout-override-flow
description: >
  A 25% partial rollout (excluded by default) is overridden by
  the user ticking [x] Migrate. The model must warn about
  re-bucketing risk, ask for confirmation, ask for rollout
  percentage, then create the flag.
skill: migrate-eppo
tags: [multi-turn, partial-rollout, override]

source_flags:
  - id: flag-005
    key: beta-feature
    name: Beta feature
    description: 25% rollout to beta testers.
    is_archived: false
    variation_type: BOOLEAN
    variations:
      - { id: var-on, name: On, variant_key: on }
      - { id: var-off, name: Off, variant_key: off }
    allocations:
      - id: alloc-beta
        key: beta-rollout
        name: Beta rollout
        type: FEATURE_GATE
        percent_exposure: 25
        is_default: false
        targeting_rules:
          - conditions:
              - operator: ONE_OF
                attribute: is_beta
                values: [true]
        variation_weight:
          - { variation_key: on, weight: 100 }
      - id: alloc-default
        key: default
        name: Default
        type: FEATURE_GATE
        percent_exposure: 100
        is_default: true
        targeting_rules: []
        variation_weight:
          - { variation_key: off, weight: 100 }

conversation:
  - |
    /migrate-eppo plan flags

    Here are the flags from my project:

    ```json
    [{"id":"flag-005","key":"beta-feature","name":"Beta feature","description":"25% rollout to beta testers.","is_archived":false,"variation_type":"BOOLEAN","variations":[{"id":"var-on","name":"On","variant_key":"on"},{"id":"var-off","name":"Off","variant_key":"off"}],"allocations":[{"id":"alloc-beta","key":"beta-rollout","name":"Beta rollout","type":"FEATURE_GATE","percent_exposure":25,"is_default":false,"targeting_rules":[{"conditions":[{"operator":"ONE_OF","attribute":"is_beta","values":[true]}]}],"variation_weight":[{"variation_key":"on","weight":100}]},{"id":"alloc-default","key":"default","name":"Default","type":"FEATURE_GATE","percent_exposure":100,"is_default":true,"targeting_rules":[],"variation_weight":[{"variation_key":"off","weight":100}]}]}]
    ```
  - "test-app"
  - "1"
  - "user_id"
  - "1"
  - "Yes, execute"
  - |
    I've marked [x] Migrate on beta-feature. Execute the plan.
  - "Yes, I understand the bucketing risk. Proceed."
  - "25"
  - "Yes"
  - "Yes"

assertions:
  - type: text_contains_question
    pattern: "bucket"
  - type: text_contains
    pattern: "25%"
  - type: text_before_tool
    pattern: "bucket"
    tool_name: mcp__confidence_flags__createFlag
  - type: tool_called
    tool_name: mcp__confidence_flags__createFlag
  - type: tool_called
    tool_name: mcp__confidence_flags__addTargetingRule
  - type: tool_called_before
    first: mcp__confidence_flags__createFlag
    second: mcp__confidence_flags__addTargetingRule
