name: blocked-flag-not-created
description: >
  A flag using the icontains operator must be classified as
  BLOCKED and never created in Confidence, even when the user
  tries to execute.
skill: migrate-posthog
tags: [multi-turn, blocked, safety]

source_flags:
  - key: internal-tools
    name: Internal tools access
    active: true
    filters:
      groups:
        - properties:
            - key: email
              operator: icontains
              value: "@acme.com"
              type: person
          rollout_percentage: 100
    multivariate: null

conversation:
  - |
    /migrate-posthog plan flags

    Here are the flags from my project:

    ```json
    [{"key":"internal-tools","name":"Internal tools access","active":true,"filters":{"groups":[{"properties":[{"key":"email","operator":"icontains","value":"@acme.com","type":"person"}],"rollout_percentage":100}]},"multivariate":null}]
    ```
  - "test-app"
  - "1"
  - "user_id"
  - "1"
  - "No, skip it. Don't migrate this flag."

assertions:
  - type: tool_not_called
    tool_name: mcp__confidence_flags__createFlag
  - type: text_contains
    pattern: "blocked"
    case_sensitive: false
  - type: text_contains
    pattern: "icontains"
    case_sensitive: false
