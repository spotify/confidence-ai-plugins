name: partial-rollout-override-flow
description: >
  A 30% partial rollout (excluded by default) is overridden by
  the user ticking [x] Migrate. The model must warn about
  re-bucketing risk, ask for confirmation, ask for rollout
  percentage, then create the flag.
skill: migrate-posthog
tags: [multi-turn, partial-rollout, override]

source_flags:
  - key: new-onboarding
    name: New onboarding flow
    active: true
    filters:
      groups:
        - properties: []
          rollout_percentage: 30
    multivariate: null

conversation:
  - |
    /migrate-posthog plan flags

    Here are the flags from my project:

    ```json
    [{"key":"new-onboarding","name":"New onboarding flow","active":true,"filters":{"groups":[{"properties":[],"rollout_percentage":30}]},"multivariate":null}]
    ```
  - "test-app"
  - "1"
  - "user_id"
  - "1"
  - "Yes, execute"
  - |
    I've marked [x] Migrate on new-onboarding. Execute the plan.
  - "Yes, I understand the bucketing risk. Proceed."
  - "30"
  - "Yes"
  - "Yes"
  - "Yes"
  - "Yes"

assertions:
  - type: text_contains_question
    pattern: "bucket"
  - type: text_contains
    pattern: "30%"
  - type: text_before_tool
    pattern: "bucket"
    tool_name: mcp__confidence_flags__createFlag
  - type: tool_called
    tool_name: mcp__confidence_flags__createFlag
  - type: tool_called
    tool_name: mcp__confidence_flags__addTargetingRule
  - type: tool_called_before
    first: mcp__confidence_flags__createFlag
    second: mcp__confidence_flags__addTargetingRule
