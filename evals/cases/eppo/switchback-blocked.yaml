name: switchback-allocation-blocked
description: >
  Allocation type is SWITCHBACK. Switchback experiments
  alternate treatments over time windows, which has no
  Confidence equivalent. BLOCKED.
tags: [blocked, switchback, unsupported_type]

input:
  user_message: |
    I want to migrate my Eppo flags to Confidence.
    Here is a flag from my project. What is the migration
    path for this one? Describe it in plain English.
  flag:
    id: "flag-009"
    key: pricing-switchback
    name: Pricing switchback
    description: Switchback experiment on pricing strategy.
    is_archived: false
    variation_type: BOOLEAN
    variations:
      - { id: "var-control", name: "Control", variant_key: "control" }
      - { id: "var-treatment", name: "Treatment", variant_key: "treatment" }
    allocations:
      - id: "alloc-switchback"
        key: switchback-test
        name: Pricing switchback test
        type: SWITCHBACK
        percent_exposure: 100
        is_default: false
        targeting_rules: []
        variation_weight:
          - { variation_key: "control", weight: 50 }
          - { variation_key: "treatment", weight: 50 }

expected:
  scope: blocked
  flag_shape: boolean
  blocked_reason: switchback
  plan_includes:
    - "blocked"
    - "switchback"
  plan_excludes:
    - "mcp__confidence"
