name: simple-gate-no-targeting
description: >
  Simplest case: boolean feature gate with a single default
  allocation at 100% exposure and no targeting rules.
  Should produce one catch-all rule.
tags: [migrate, boolean, everyone, simple]

input:
  user_message: |
    I want to migrate my Eppo flags to Confidence.
    Here is a flag from my project. What is the migration
    path for this one? Describe it in plain English.
  flag:
    id: "flag-001"
    key: simple-gate
    name: Simple gate
    description: 100% rollout to everyone, no targeting.
    is_archived: false
    variation_type: BOOLEAN
    variations:
      - { id: "var-on", name: "On", variant_key: "on" }
      - { id: "var-off", name: "Off", variant_key: "off" }
    allocations:
      - id: "alloc-default"
        key: default
        name: Default allocation
        type: FEATURE_GATE
        percent_exposure: 100
        is_default: true
        targeting_rules: []
        variation_weight:
          - { variation_key: "on", weight: 100 }

expected:
  scope: migrate
  flag_shape: boolean
  plan_includes:
    - "simple-gate"
    - "100%"
    - "everyone"
  plan_excludes:
    - "eqRule"
    - "setRule"
    - "mcp__confidence"
  resolutions:
    - context: { country: "US" }
      variant: "on"
    - context: {}
      variant: "on"
