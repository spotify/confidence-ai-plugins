name: regex-matches-blocked
description: >
  Targeting uses MATCHES with a generic regex (classes and
  quantifiers mid-pattern) — not expressible as starts-with
  or ends-with. BLOCKED.
tags: [blocked, regex, unsupported_operator]

input:
  user_message: |
    I want to migrate my Eppo flags to Confidence.
    Here is a flag from my project. What is the migration
    path for this one? Describe it in plain English.
  flag:
    id: "flag-006"
    key: internal-tools
    name: Internal tools
    description: Gate for internal email addresses via regex.
    is_archived: false
    variation_type: BOOLEAN
    variations:
      - { id: "var-on", name: "On", variant_key: "on" }
      - { id: "var-off", name: "Off", variant_key: "off" }
    allocations:
      - id: "alloc-internal"
        key: internal
        name: Internal users
        type: FEATURE_GATE
        percent_exposure: 100
        is_default: false
        targeting_rules:
          - conditions:
              - operator: MATCHES
                attribute: email
                values: ["^[a-z]{3}-[0-9]{4}-(eu|us)$"]
        variation_weight:
          - { variation_key: "on", weight: 100 }
      - id: "alloc-default"
        key: default
        name: Default
        type: FEATURE_GATE
        percent_exposure: 100
        is_default: true
        targeting_rules: []
        variation_weight:
          - { variation_key: "off", weight: 100 }

expected:
  scope: blocked
  flag_shape: boolean
  blocked_reason: regex
  plan_includes:
    - "blocked"
    - "regex"
  plan_excludes:
    - "mcp__confidence"
