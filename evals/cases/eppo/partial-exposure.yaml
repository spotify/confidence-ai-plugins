name: partial-exposure-gate
description: >
  Feature gate with percent_exposure at 25 (< 100).
  Partial exposures are excluded because Confidence uses
  a different bucketing hash — the 25% cohort cannot be
  reproduced. User can opt-in at execute time.
tags: [excluded, partial_exposure, boolean]

input:
  user_message: |
    I want to migrate my Eppo flags to Confidence.
    Here is a flag from my project. What is the migration
    path for this one? Describe it in plain English.
  flag:
    id: "flag-005"
    key: beta-feature
    name: Beta feature
    description: 25% rollout to beta testers.
    is_archived: false
    variation_type: BOOLEAN
    variations:
      - { id: "var-on", name: "On", variant_key: "on" }
      - { id: "var-off", name: "Off", variant_key: "off" }
    allocations:
      - id: "alloc-beta"
        key: beta-rollout
        name: Beta rollout
        type: FEATURE_GATE
        percent_exposure: 25
        is_default: false
        targeting_rules:
          - conditions:
              - operator: ONE_OF
                attribute: is_beta
                values: [true]
        variation_weight:
          - { variation_key: "on", weight: 100 }
      - id: "alloc-default"
        key: default
        name: Default
        type: FEATURE_GATE
        percent_exposure: 100
        is_default: true
        targeting_rules: []
        variation_weight:
          - { variation_key: "off", weight: 100 }

expected:
  scope: excluded
  flag_shape: boolean
  blocked_reason: partial_exposure
  plan_includes:
    - "25%"
    - "partial"
    - "bucket"
    - "excluded"
  plan_excludes:
    - "eqRule"
    - "mcp__confidence"
