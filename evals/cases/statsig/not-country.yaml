name: not-country-none-operator
description: >
  Gate with country condition using operator "none" to
  exclude users in DE and FR. The "none" operator is a
  negation — should map to a Confidence targeting rule
  that excludes those countries.
tags: [migrate, boolean, country, none_operator]

input:
  user_message: |
    I want to migrate my Statsig flags to Confidence.
    Here is a flag from my project. What is the migration
    path for this one? Describe it in plain English.
  flag:
    id: gate_006
    name: Not Country Gate
    description: Gate excluding Germany and France.
    idType: userID
    isEnabled: true
    status: Active
    type: PERMANENT
    rules:
      - name: Exclude DE and FR
        id: rule_006
        passPercentage: 100
        conditions:
          - type: country
            operator: none
            targetValue:
              - DE
              - FR

expected:
  scope: migrate
  flag_shape: boolean
  plan_includes:
    - "country"
    - "DE"
    - "FR"
    - "exclude"
  plan_excludes:
    - "eqRule"
    - "setRule"
    - "mcp__confidence"
  resolutions:
    - context: { country: "US" }
      variant: "on"
    - context: { country: "GB" }
      variant: "on"
    - context: { country: "DE" }
      variant: "off"
    - context: { country: "FR" }
      variant: "off"
