name: experiment-ab-excluded
description: >
  Statsig experiment with 2 groups at 50/50 split and
  100% allocation. Live experiments with multiple variants
  are excluded from migration.
tags: [excluded, live_experiment, multivariate]

input:
  user_message: |
    I want to migrate my Statsig flags to Confidence.
    Here is a flag from my project. What is the migration
    path for this one? Describe it in plain English.
  flag:
    id: experiment_001
    name: Checkout Experiment
    description: A/B test on the checkout flow.
    idType: userID
    status: Active
    allocation: 100
    controlGroupID: group_ctrl
    groups:
      - name: Control
        id: group_ctrl
        size: 50
        parameterValues:
          button_color: blue
          cta_text: Buy now
      - name: Test
        id: group_test
        size: 50
        parameterValues:
          button_color: green
          cta_text: Get started

expected:
  scope: excluded
  flag_shape: struct
  blocked_reason: live_experiment
  plan_includes:
    - "experiment"
    - "exclude"
  plan_excludes:
    - "eqRule"
    - "setRule"
    - "mcp__confidence"
