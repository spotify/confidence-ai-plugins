name: custom-field-age-gte
description: >
  Gate with a custom_field condition on "age" using operator
  "gte" with targetValue 18. Should map to a Confidence
  targeting rule with a numeric context field comparison.
tags: [migrate, boolean, custom_field, gte_operator]

input:
  user_message: |
    I want to migrate my Statsig flags to Confidence.
    Here is a flag from my project. What is the migration
    path for this one? Describe it in plain English.
  flag:
    id: gate_007
    name: Age Gate
    description: Gate for users aged 18 and above.
    idType: userID
    isEnabled: true
    status: Active
    type: PERMANENT
    rules:
      - name: Adults only
        id: rule_007
        passPercentage: 100
        conditions:
          - type: custom_field
            field: age
            operator: gte
            targetValue: 18

expected:
  scope: migrate
  flag_shape: boolean
  plan_includes:
    - "age"
    - "18"
    - "greater"
  plan_excludes:
    - "eqRule"
    - "setRule"
    - "mcp__confidence"
  resolutions:
    - context: { age: 18 }
      variant: "on"
    - context: { age: 21 }
      variant: "on"
    - context: { age: 17 }
      variant: "off"
    - context: {}
      variant: "off"
