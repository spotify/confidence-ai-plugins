name: plan-badge-exists-is-not-null
description: >
  Audience uses exists match on "plan" attribute.
  Auto-translate to IS NOT NULL and tell the user.
  Not BLOCKED.
tags: [exists, workaround, is-not-null]

input:
  user_message: |
    I want to migrate my Optimizely flags to Confidence.
    Here is a flag from my project. What is the migration
    path for this one? Describe it in plain English.
  flag:
    key: plan_badge
    name: Plan badge
    description: Show badge if user has a plan attribute.
    archived: false
    variable_definitions: {}
    variations:
      - { key: on, name: On }
      - { key: off, name: Off }
    ruleset:
      enabled: true
      default_variation_key: off
      rule_priorities: [has_plan]
      rules:
        has_plan:
          type: targeted_delivery
          percentage_included: 10000
          audience_conditions: ["or", { audience_id: 10 }]
          audience_ids: [10]
          variations:
            on: { percentage_included: 10000 }
    referenced_audiences:
      "10":
        name: Has plan
        conditions: >
          ["and",
          {"type": "custom_attribute",
          "name": "plan",
          "match_type": "exists"}]

expected:
  scope: migrate
  flag_shape: boolean
  plan_includes:
    - "IS NOT NULL"
    - "exists"
  plan_excludes:
    - "eqRule"
    - "mcp__confidence"
  resolutions:
    - context: { plan: "pro" }
      variant: "on"
    - context: {}
      variant: "off"
