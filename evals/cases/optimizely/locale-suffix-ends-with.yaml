name: locale-suffix-ends-with
description: >
  Audience uses substring on locale with a leading underscore suffix.
  Auto-translate to ends with and tell the user. Not BLOCKED.
tags: [substring, workaround, ends-with]

input:
  user_message: |
    I want to migrate my Optimizely flags to Confidence.
    Here is a flag from my project. What is the migration
    path for this one? Describe it in plain English.
  flag:
    key: locale-suffix-gate
    name: Locale suffix gate
    description: Gate using locale suffix contains.
    archived: false
    variable_definitions: {}
    variations:
      - { key: on, name: On }
      - { key: off, name: Off }
    ruleset:
      enabled: true
      default_variation_key: off
      rule_priorities: [locale_check]
      rules:
        locale_check:
          type: targeted_delivery
          percentage_included: 10000
          audience_conditions: ["or", { audience_id: 13 }]
          audience_ids: [13]
          variations:
            on: { percentage_included: 10000 }
    referenced_audiences:
      "13":
        name: Locale ends beta
        conditions: >
          ["and",
          {"type": "custom_attribute", "name": "device_locale",
          "match_type": "substring", "value": "_beta"}]

expected:
  scope: migrate
  flag_shape: boolean
  plan_includes:
    - "ends with"
    - "substring"
  plan_excludes:
    - "endsWithRule"
    - "eqRule"
    - "mcp__confidence"
  resolutions:
    - context: { device_locale: "en_beta" }
      variant: "on"
    - context: { device_locale: "en_US" }
      variant: "off"
    - context: {}
      variant: "off"
