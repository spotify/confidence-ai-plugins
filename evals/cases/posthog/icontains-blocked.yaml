name: icontains-blocked
description: >
  Filter uses the icontains operator on email domain.
  Confidence has no case-insensitive contains rule,
  so this flag is BLOCKED.
tags: [blocked, icontains, unsupported_operator]

input:
  user_message: |
    I want to migrate my PostHog flags to Confidence.
    Here is a flag from my project. What is the migration
    path for this one? Describe it in plain English.
  flag:
    key: internal-tools
    name: Internal tools access
    active: true
    filters:
      groups:
        - properties:
            - key: email
              operator: icontains
              value: "@acme.com"
              type: person
          rollout_percentage: 100
    multivariate: null

expected:
  scope: blocked
  flag_shape: boolean
  blocked_reason: icontains
  plan_includes:
    - "blocked"
    - "icontains"
  plan_excludes:
    - "mcp__confidence"
