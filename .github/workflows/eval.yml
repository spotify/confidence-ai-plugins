name: Braintrust Evals

on:
  pull_request:
    paths:
      - 'skills/migrate-optimizely/**'
      - 'evals/**'
  push:
    branches: [main]
    paths:
      - 'skills/migrate-optimizely/**'
      - 'evals/**'
  workflow_dispatch:
    inputs:
      skill:
        description: 'Skill to evaluate (e.g. migrate-optimizely)'
        required: false
        default: 'migrate-optimizely'

permissions:
  contents: read

jobs:
  eval:
    name: Run migration skill evals
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: |
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Run evals
        env:
          HENDRIX_API_KEY: ${{ secrets.HENDRIX_API_KEY }}
          HENDRIX_BASE_URL: ${{ secrets.HENDRIX_BASE_URL }}
          BRAINTRUST_API_KEY: ${{ secrets.BRAINTRUST_API_KEY }}
          BRAINTRUST_API_URL: ${{ secrets.BRAINTRUST_API_URL }}
        run: npx braintrust eval evals/migrate-optimizely.eval.ts
