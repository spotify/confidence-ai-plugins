name: Braintrust Evals

on:
  pull_request:
    paths:
      - 'skills/migrate-optimizely/**'
      - 'evals/**'
  workflow_dispatch:
    inputs:
      skill:
        description: 'Skill to evaluate (e.g. migrate-optimizely)'
        required: false
        default: 'migrate-optimizely'

jobs:
  eval:
    name: Run migration skill evals
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: npm ci

      - name: Extract fixtures
        run: python3 evals/scripts/extract-fixtures.py

      - name: Run evals
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          BRAINTRUST_API_KEY: ${{ secrets.BRAINTRUST_API_KEY }}
          BRAINTRUST_API_URL: https://braintrust.spotifyinternal.com
        run: npx braintrust eval evals/migrate-optimizely.eval.ts
