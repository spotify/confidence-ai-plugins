name: Evals

on:
  pull_request:
    paths:
      - 'skills/migrate-optimizely/**'
      - 'skills/migrate-posthog/**'
      - 'skills/migrate-eppo/**'
      - 'skills/migrate-statsig/**'
      - 'evals/**'
  push:
    branches: [main]
    paths:
      - 'skills/migrate-optimizely/**'
      - 'evals/**'
  workflow_dispatch:
    inputs:
      skill:
        description: 'Skill to evaluate (e.g. migrate-optimizely)'
        required: false
        default: 'migrate-optimizely'

permissions:
  contents: read
  pull-requests: write

jobs:
  eval:
    name: Run migration skill evals
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: |
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: |
          npm ci
          test -d node_modules/@anthropic-ai/sdk || { echo "::error::Dependencies not installed"; exit 1; }

      - name: Run evals
        id: eval
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY || secrets.HENDRIX_API_KEY }}
          BRAINTRUST_API_KEY: ${{ secrets.BRAINTRUST_API_KEY }}
          BRAINTRUST_API_URL: ${{ secrets.BRAINTRUST_API_URL }}
        run: |
          OUTPUT=$(npx --no braintrust eval evals/migrate-optimizely.eval.ts evals/migrate-posthog.eval.ts evals/migrate-eppo.eval.ts evals/migrate-statsig.eval.ts 2>&1)
          echo "$OUTPUT"
          echo "$OUTPUT" > eval-output.txt

          # Baseline diffs are informational only — LLM judge scores wobble a
          # few points run-to-run; the hard gate below catches real drops.
          REGRESSIONS=$(echo "$OUTPUT" | grep "regressions)" | grep -v "0 regressions" || true)
          if [ -n "$REGRESSIONS" ]; then
            echo "::warning::Scores moved vs previous experiment (informational):"
            echo "$REGRESSIONS"
          fi

          # Hard gate: minimum ScopeClassification and FlagShape across ALL skills
          MIN_SCOPE=$(echo "$OUTPUT" | grep "'ScopeClassification'" | grep -oP '^[\d.]+' | sort -n | head -1)
          MIN_SHAPE=$(echo "$OUTPUT" | grep "'FlagShape'" | grep -oP '^[\d.]+' | sort -n | head -1)
          echo "min_scope=$MIN_SCOPE" >> "$GITHUB_OUTPUT"
          echo "min_shape=$MIN_SHAPE" >> "$GITHUB_OUTPUT"

          THRESHOLD=85
          FAIL=0
          for pair in "ScopeClassification:$MIN_SCOPE" "FlagShape:$MIN_SHAPE"; do
            name="${pair%%:*}"; val="${pair#*:}"
            if [ -n "$val" ] && awk -v v="$val" -v t="$THRESHOLD" 'BEGIN{exit !(v<t)}'; then
              echo "::error::$name dropped below ${THRESHOLD}% (got ${val}%)"
              FAIL=1
            fi
          done
          exit $FAIL

      - name: Comment PR with results
        if: github.event_name == 'pull_request' && steps.eval.outcome == 'success'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            if (!fs.existsSync('eval-output.txt')) return;
            const output = fs.readFileSync('eval-output.txt', 'utf8');
            const summaryMatch = output.match(/=+SUMMARY=+([\s\S]*?)(?:See results|$)/);
            if (!summaryMatch) return;
            const summary = summaryMatch[1].trim();
            const urlMatch = output.match(/(https:\/\/www\.braintrust\.dev\S+)/);
            const url = urlMatch ? urlMatch[1] : '';

            const body = `## Eval Results\n\n\`\`\`\n${summary}\n\`\`\`\n\n${url ? `[View details](${url})` : ''}`;

            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body
            });
