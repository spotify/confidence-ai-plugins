name: Data onboarding checks

on:
  pull_request:
    paths:
      - 'skills/onboard-data/**'
      - 'commands/onboard-data.md'
      - 'evals/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - '.mcp.json'
      - '*-extension.json'
      - '.*-plugin/plugin.json'
      - 'AGENTS.md'
      - 'CLAUDE.md'
      - 'GEMINI.md'
      - 'README.md'
      - '.github/workflows/onboard-data-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:onboard-data
